{% extends 'base.html' %}{% block title %}Acesso à gestão{% endblock %}
{% block content %}<section class="login-section"><div class="login-panel"><span class="kicker">ACESSO RESERVADO</span><h1>Gestão {{ app_name }}</h1><p>Introduza as credenciais do administrador.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-field"><label>Utilizador</label><input name="username" required autofocus placeholder="admin"></div><div class="form-field"><label>Palavra-passe</label><input name="password" type="password" required></div><button class="btn btn-primary btn-submit">Entrar no painel ↗</button></form></div></section>{% endblock %}
