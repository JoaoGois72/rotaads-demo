<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#020b14"><meta name="referrer" content="no-referrer"><title>{{ app_name }} • {{ device.nome }}</title><link rel="stylesheet" href="{{ url_for('static', filename='player.css') }}"></head>
<body><main id="screen"><div id="content"><div class="screen-wait"><div class="screen-symbol">↗</div><h1>{{ app_name }}</h1><p id="status">A preparar a publicidade…</p></div></div><aside id="qr-wrap" style="display:none"><img id="qr" alt="Código QR da oferta"><span>Digitalize para descobrir a oferta</span></aside></main>
<div id="toolbar"><span id="device-label">{{ device.nome }}</span><span id="connection">A ligar…</span><span id="gps-state" aria-live="polite">GPS desligado</span><button id="gps-button" type="button" title="Partilhar posição para mostrar publicidade por zona">Ativar GPS</button><button id="fullscreen-btn" type="button">Ecrã completo ⛶</button></div>
<script>window.PLAYER_CONFIG={{ {'token': token, 'app': app_name}|tojson }};</script><script src="{{ url_for('static', filename='player.js') }}"></script></body></html>
